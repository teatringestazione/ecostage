<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Leggere il luogo – taccuino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;800&family=Alegreya+Sans:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: zine da un foglio A4 (8 facciate). A schermo: facciate in ordine di lettura; in stampa: foglio imposto 4x2 con riga superiore capovolta */
:root{
  --bg:#eef0ec; --paper:#fbfcfa; --fg:#232724; --muted:#68706a; --rule:#c9cfc8; --accent:#2f6f6a; --stone:#8b8f86;
  --display:"Alegreya", Georgia, serif; --body:"Alegreya Sans", "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171a18;--paper:#202421;--fg:#e6ebe6;--muted:#9aa39c;--rule:#3a403b;--accent:#6fb3ac;--stone:#7d827a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a18;--paper:#202421;--fg:#e6ebe6;--muted:#9aa39c;--rule:#3a403b;--accent:#6fb3ac;--stone:#7d827a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body)}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,42px);margin:0 0 6px;text-wrap:balance}
.head p{margin:0 0 20px;color:var(--muted);max-width:65ch;line-height:1.5}
.read{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pnl{background:var(--paper);border:1px solid var(--rule);aspect-ratio:74.25/105;max-width:100%;padding:16px 14px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.35;position:relative;overflow:hidden}
.pg{position:absolute;bottom:8px;right:10px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.pnl h2{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;margin:0}
.pnl h3{font-family:var(--display);font-weight:500;font-size:15px;margin:4px 0 0}
.q{color:var(--muted);font-size:12px}
.lines{flex:1;min-height:30px;background:repeating-linear-gradient(to bottom,transparent 0 17px,var(--rule) 17px 18px)}
.box{flex:1;border:1px dashed var(--stone);display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;font-family:var(--mono);font-size:9px;color:var(--muted);min-height:60px}
.field{display:flex;gap:6px;align-items:flex-end;font-family:var(--mono);font-size:11px}
.field span{flex:1;border-bottom:1px solid var(--rule);height:14px}
.cover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.cover .lbl,.cover .pg{color:var(--paper);opacity:.85}
.cover h2{font-size:30px;margin-top:auto}
.cover .field span{border-color:var(--paper);opacity:.7}
.contour{height:70px;background:
 radial-gradient(ellipse 60% 40% at 40% 60%,transparent 48%,currentColor 49% 51%,transparent 52%),
 radial-gradient(ellipse 45% 30% at 42% 62%,transparent 47%,currentColor 48% 51%,transparent 52%),
 radial-gradient(ellipse 30% 18% at 44% 64%,transparent 45%,currentColor 46% 50%,transparent 51%);opacity:.6}
ul.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.chk li{display:flex;gap:7px;align-items:flex-start}
ul.chk li::before{content:"";flex:none;width:11px;height:11px;border:1.5px solid var(--accent);margin-top:2px}
.fold{font-family:var(--mono);font-size:10.5px;line-height:1.45}
.fold ol{margin:0;padding-left:16px}
.sheet{display:none}
@page{size:A4 landscape;margin:0}
@media print{
  :root{--paper:#fff;--fg:#1a1a1a;--muted:#555;--rule:#bbb}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  html,body{margin:0;padding:0}
  .head,.read{display:none}
  .sheet{display:grid;grid-template-columns:repeat(4,74.25mm);grid-template-rows:repeat(2,105mm);width:297mm;height:210mm}
  .sheet .pnl{aspect-ratio:auto;border:0;outline:.2pt dashed #ccc;padding:7mm 6mm;font-size:9.5pt}
  .sheet .flip{transform:rotate(180deg)}
}
</style>
<div class="wrap">
  <div class="head">
    <h1>Leggere il luogo</h1>
    <p>Taccuino da campo per la regia del paesaggio, tratto dal modulo di Serena Gatti nel progetto EcoStage. Si stampa su un solo foglio A4 e si piega in un libretto da tasca di 8 facciate. Qui sotto le facciate sono in ordine di lettura.</p>
  </div>
  <div class="read" id="read"></div>
  <div class="sheet" id="sheet"></div>
</div>
<script>
const P={
1:`<div class="pnl cover"><span class="lbl">EcoStage · regia del paesaggio</span><div class="contour"></div><h2>Leggere il luogo</h2><div class="field">Nome <span></span></div><div class="field">Luogo <span></span></div><div class="field">Data <span></span></div></div>`,
2:`<div class="pnl"><span class="lbl">Come si usa</span><h2>Il luogo non è un fondale</h2><p>Camminate il sito in piccoli gruppi per 90 minuti. Compilate una facciata alla volta, senza fretta e senza dispositivi.</p><p>Guardate prima, scrivete dopo. Toccate solo ciò che potete lasciare com'era.</p><p class="q">Prima di uscire guardate insieme la video performance «Sentieri 11 · Isola del Giglio».</p></div>`,
3:`<div class="pnl"><span class="lbl">Livelli 1 · 2</span><h3>Topografia</h3><p class="q">Dislivelli, percorsi, punti di vista, confini.</p><div class="lines"></div><h3>Geografia della luce</h3><p class="q">Da dove arriva, a che ora, dove fa ombra.</p><div class="lines"></div></div>`,
4:`<div class="pnl"><span class="lbl">Livelli 3 · 4</span><h3>Acustica</h3><p class="q">Suoni naturali, rumori, silenzi, eco.</p><div class="lines"></div><h3>Materia</h3><p class="q">Pietra, terra, piante, acqua: cosa si può toccare senza alterarlo?</p><div class="lines"></div></div>`,
5:`<div class="pnl"><span class="lbl">Livello 5</span><h3>Lirica del luogo</h3><p class="q">Una parola o un'immagine che il luogo vi suggerisce.</p><div class="field">→ <span></span></div><h3>Mappa a mano</h3><div class="box">segnate: inizio · percorso · pubblico</div></div>`,
6:`<div class="pnl"><span class="lbl">Impatto zero</span><h2>Prima di provare</h2><ul class="chk"><li>Solo luce naturale o fonti a batteria</li><li>Suono non amplificato o dispositivi non invasivi</li><li>Nessun materiale lasciato sul posto</li><li>Solo materiali biologici o reversibili</li><li>Il percorso non calpesta aree fragili</li><li>Il pubblico arriva a piedi o con mezzi pubblici</li></ul></div>`,
7:`<div class="pnl"><span class="lbl">Partitura · 5 minuti</span><h3>Dove inizia</h3><div class="lines"></div><h3>Come si sposta</h3><div class="lines"></div><h3>Cosa resta al pubblico</h3><div class="lines"></div></div>`,
8:`<div class="pnl"><span class="lbl">Per chiudere</span><p><b>Domanda per tutti:</b> come cambia il rapporto con il paesaggio quando smettiamo di metterci al centro?</p><div class="lines" style="max-height:70px"></div><div class="fold"><b>Come piegare il foglio</b><ol><li>Piegate a metà nel senso lungo, poi riaprite.</li><li>Piegate in quattro nel senso corto, poi riaprite.</li><li>Tagliate al centro, tra le due facciate interne.</li><li>Piegate nel senso lungo e spingete verso il taglio fino a formare una croce, poi chiudete a libretto.</li></ol></div></div>`
};
const pn=(h,n)=>h.replace(/<\/div>$/,`<span class="pg">${n===1?"":n}</span></div>`);
document.getElementById("read").innerHTML=[1,2,3,4,5,6,7,8].map(n=>pn(P[n],n)).join("");
const T=[5,4,3,2], B=[6,7,8,1];
document.getElementById("sheet").innerHTML=T.map(n=>pn(P[n],n).replace('class="pnl','class="flip pnl')).join("")+B.map(n=>pn(P[n],n)).join("");
</script>
</body></html>
